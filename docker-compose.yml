# docker-compose.yml
# Local development and container orchestration.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: upskilr-backend:local
    container_name: upskilr-backend
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
